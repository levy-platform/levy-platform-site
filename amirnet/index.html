<style>
/* Layout: mobile-first study app on the levy-platform brand — ivory paper, ink, bronze; bottom tab bar on phones, top tabs on desktop; one working column.
   Type: Heebo (Hebrew UI, brand), Frank Ruhl Libre (display, sparingly), Lexend (English content — built for reading ease). */
:root{
  --paper:#FAF8F4; --sheet:#FFFFFF; --ink:#12100D; --muted:#5F584E; --rule:#E6DFD2; --soft:#F3EEE4;
  --accent:#8C6A2F; --accent-fill:#A67C37; --accent-ink:#FFFFFF; --mark:#F5EEDF;
  --good:#2F6B47; --good-bg:#E6F1EA; --bad:#A33A2E; --bad-bg:#F8E7E3; --warn:#8A5714;
  --shadow:0 10px 30px rgba(18,16,13,.07); --shadow-sm:0 1px 3px rgba(18,16,13,.06),0 1px 1px rgba(18,16,13,.03);
  --r:16px; --r-sm:12px;
  --display:"Frank Ruhl Libre","David",Georgia,serif;
  --body:"Heebo","Arial Hebrew",system-ui,sans-serif;
  --en:"Lexend","Helvetica Neue",Arial,sans-serif;
  --mono:"Heebo",system-ui,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#14120F; --sheet:#1D1A16; --ink:#F3EEE5; --muted:#B3AA9B; --rule:#34302A; --soft:#26221D;
  --accent:#D9B06A; --accent-fill:#C49A52; --accent-ink:#14120F; --mark:#3A3023;
  --good:#7BC79A; --good-bg:#18291F; --bad:#F0958A; --bad-bg:#3A1F1B; --warn:#E2AE63;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 1px 3px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#14120F; --sheet:#1D1A16; --ink:#F3EEE5; --muted:#B3AA9B; --rule:#34302A; --soft:#26221D;
  --accent:#D9B06A; --accent-fill:#C49A52; --accent-ink:#14120F; --mark:#3A3023;
  --good:#7BC79A; --good-bg:#18291F; --bad:#F0958A; --bad-bg:#3A1F1B; --warn:#E2AE63;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 1px 3px rgba(0,0,0,.4); color-scheme:dark }
html{direction:rtl;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16.5px/1.65 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2{font-family:var(--display);line-height:1.18;margin:0;text-wrap:balance;letter-spacing:-.2px}
h1{font-size:clamp(1.75rem,5.4vw,2.5rem);font-weight:900}

p{margin:0}

button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--accent-fill);outline-offset:2px;border-radius:6px}
.num{font-family:var(--body);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--en);text-align:left}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header (desktop tabs) + bottom bar (phones) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--sheet) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px;min-height:60px}
.brand{font:900 1.22rem var(--display);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand b{font:800 .85rem var(--body);background:var(--ink);color:var(--paper);padding:2px 9px;border-radius:99px;letter-spacing:.3px}
nav#nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav#nav::-webkit-scrollbar{display:none}
nav#nav button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:8px 12px;border-radius:99px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600;font-size:.95rem;transition:background .18s,color .18s}
nav#nav button .ico{width:18px;height:18px}
nav#nav button:hover{background:var(--soft);color:var(--ink)}
nav#nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav#nav button .ico{display:none}
@media (max-width:1100px){ nav#nav button{padding:8px 10px;font-size:.9rem} .top-in{gap:12px} .brand{font-size:1.1rem} }
@media (min-width:761px) and (max-width:960px){ .sync{font-size:0;gap:0} .sync::before{width:9px;height:9px} }
.sync{font:500 .75rem var(--body);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--good)}
.bnav{display:none}
.sheet-menu{position:fixed;inset:0;z-index:25;background:rgba(18,16,13,.4);display:flex;align-items:flex-end}
.sheet-menu > div{background:var(--sheet);width:100%;border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.sheet-menu .grab{width:40px;height:4px;border-radius:99px;background:var(--rule);margin:2px auto 10px}
.sheet-menu button{display:flex;align-items:center;gap:14px;background:none;border:0;padding:14px 8px;border-radius:var(--r-sm);font-weight:600;font-size:1.02rem;cursor:pointer;text-align:right;min-height:52px}
.sheet-menu button:hover,.sheet-menu button[aria-current="page"]{background:var(--soft)}
@media (max-width:760px){
  nav#nav{display:none}
  .top-in{min-height:54px;justify-content:space-between}
  .bnav{display:flex;position:fixed;inset:auto 0 0;z-index:12;background:color-mix(in srgb,var(--sheet) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--rule);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 2px;border-radius:12px;color:var(--muted);font:600 .72rem var(--body);cursor:pointer;min-height:52px;transition:color .18s}
  .bnav button[aria-current="page"]{color:var(--ink)}
  .bnav button[aria-current="page"] .ico{stroke-width:2.3}
  .bnav button[aria-current="page"]::after{content:"";width:18px;height:3px;border-radius:99px;background:var(--accent-fill);margin-top:1px}
  main#app{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))!important}
  .toast{bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px))!important}
}

main{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 80px;display:flex;flex-direction:column;gap:24px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.grid > *{min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow-sm)}
button.card{font:inherit;color:inherit;transition:border-color .18s,box-shadow .18s,transform .18s}
button.card:hover{border-color:var(--accent-fill);box-shadow:var(--shadow)}
.tile b{font:800 1.85rem/1.1 var(--body);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.9rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:4px}
.hero-card{border:0;background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.hero-card .muted,.hero-card .small.muted{color:color-mix(in srgb,var(--paper) 70%,var(--ink))}
.hero-card .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.hero-card .btn.ghost{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 40%,transparent)}
.hero-card .ok-t{color:#8FD3AA}
.hero-card .step{border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:1.5px solid var(--ink);border-radius:99px;background:var(--ink);color:var(--paper);font-weight:700;cursor:pointer;text-decoration:none;min-height:46px;transition:background .18s,color .18s,border-color .18s,transform .12s,opacity .18s}
.btn:hover{background:color-mix(in srgb,var(--ink) 86%,var(--accent-fill))}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink);background:var(--soft)}
.btn.accent{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.btn.sm{padding:6px 14px;min-height:40px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.chip{border:1.5px solid var(--rule);background:var(--sheet);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:.92rem;font-weight:500;min-height:40px;transition:border-color .18s,background .18s,color .18s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.92rem}
input[type=date],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{border:1.5px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);padding:9px 12px;min-height:46px;font-size:16px;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-fill);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-fill) 22%,transparent)}
textarea{min-height:70px;width:100%}

/* question */
.q{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow-sm)}
.q-meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:.88rem;color:var(--muted)}
.stem{font:400 1.14rem/1.7 var(--en);direction:ltr;text-align:left;letter-spacing:-.005em}
.stem .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent-fill);margin-inline:2px}
.opts{display:flex;flex-direction:column;gap:10px;direction:ltr}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:12px 16px;border:1.5px solid var(--rule);border-radius:14px;background:var(--sheet);cursor:pointer;font:1.04rem/1.5 var(--en);min-height:54px;color:var(--ink);transition:border-color .16s,background .16s,box-shadow .16s}
.opt:hover:not(:disabled){border-color:var(--accent-fill);box-shadow:var(--shadow-sm)}
.opt .bub{flex:none;width:28px;height:28px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font:600 .82rem var(--body);color:var(--muted)}
.opt.sel{border-color:var(--ink)} .opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.explain{border-inline-start:3px solid var(--accent-fill);border-radius:var(--r-sm);padding:12px 16px;background:var(--soft);display:flex;flex-direction:column;gap:8px;line-height:1.7}
.ai{white-space:pre-wrap}
.passage{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px;font:1rem/1.8 var(--en);direction:ltr;text-align:left;display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow:auto;box-shadow:var(--shadow-sm)}
.passage h3{font:600 1.08rem var(--en)}
.passage p b{font:600 .75rem var(--body);color:var(--muted);margin-right:6px}
.timer{font:700 1.15rem var(--body);font-variant-numeric:tabular-nums;padding:4px 14px;border:1.5px solid var(--rule);border-radius:99px;background:var(--sheet)}
.timer.low{border-color:var(--bad);color:var(--bad)}
.qbar{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.qbar button{width:40px;height:40px;border:1.5px solid var(--rule);border-radius:50%;background:var(--sheet);font:600 .9rem var(--body);cursor:pointer}
.qbar button.done{background:var(--soft);border-color:var(--muted)}
.qbar button.cur{border:2px solid var(--ink)}
.cat{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* flashcard */
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:22px;min-height:280px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;box-shadow:var(--shadow)}
.flash .w{font:600 clamp(2rem,8vw,3rem)/1.15 var(--en);direction:ltr;letter-spacing:-.02em}
.flash .he{font:700 1.45rem/1.4 var(--body)}
.flash .ex{font:400 1.02rem/1.6 var(--en);direction:ltr;color:var(--muted);max-width:52ch}
.boxes{display:flex;gap:4px;direction:ltr}
.boxes i{width:20px;height:6px;border-radius:99px;background:var(--soft);border:1px solid var(--rule)}
.boxes i.on{background:var(--accent-fill);border-color:var(--accent-fill)}
.card-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.kbd-hint{opacity:.65;font-weight:500}
@media (hover:none){.kbd-hint{display:none}}
.card-actions .btn{min-width:130px;min-height:52px}

/* tables & bars */
.scroll{overflow-x:auto;border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;background:var(--sheet);font-size:.94rem}
th,td{border-bottom:1px solid var(--rule);padding:10px 12px;text-align:right;vertical-align:top}
th{background:var(--soft);font-weight:700}
.meter{height:8px;background:var(--soft);border-radius:99px;direction:ltr;position:relative;overflow:hidden}
.meter i{position:absolute;inset-block:0;left:0;background:var(--accent-fill);border-radius:99px;transition:width .4s ease}
.pill{display:inline-flex;align-items:center;padding:2px 11px;border:1.5px solid currentColor;border-radius:99px;font-weight:700;font-size:.82rem;white-space:nowrap}
.ok-t{color:var(--good)} .no-t{color:var(--bad)} .warn-t{color:var(--warn)}

/* answer sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px 14px;direction:ltr}
.srow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:10px}
.srow .n{font:600 .85rem var(--body);width:22px;text-align:right;color:var(--muted)}
.srow button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;font:600 .78rem var(--body);cursor:pointer}
.srow button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.srow button.key{box-shadow:0 0 0 3px var(--good)}
.srow.wrong{background:var(--bad-bg)} .srow.right{background:var(--good-bg)}

/* plan */
.week{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.week > header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.week.now{border:2px solid var(--accent-fill)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--rule)}
.task:last-child{border-bottom:0}
.task input{appearance:none;flex:none;width:24px;height:24px;margin-top:2px;border:2px solid var(--muted);border-radius:50%;cursor:pointer;transition:background .16s,border-color .16s}
.task input:checked{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 4px var(--sheet)}
.task input:checked ~ div .tt{text-decoration:line-through;color:var(--muted)}
.task .go{margin-inline-start:auto}
svg text{fill:var(--muted);font:600 11px var(--body)}
.empty{border:1.5px dashed var(--rule);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:99px;z-index:20;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.loading{display:flex;flex-direction:column;gap:14px}
.loading i{display:block;height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--sheet),var(--soft));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
/* lessons */
.lesson{display:flex;flex-direction:column;gap:16px;max-width:70ch}
.lesson p,.lesson li{line-height:1.8}
.lesson h3{font-size:1.15rem;margin-top:8px}
.lesson ul,.lesson ol{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:6px}
.lesson .tip{border-inline-start:3px solid var(--good);background:var(--good-bg);padding:12px 16px;border-radius:var(--r-sm)}
.lesson .warn{border-inline-start:3px solid var(--bad);background:var(--bad-bg);padding:12px 16px;border-radius:var(--r-sm)}
.lesson .exb{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);display:flex;flex-direction:column;overflow:hidden}
.lesson .exb .en{padding:12px 16px;white-space:pre-wrap;border-bottom:1px solid var(--rule);font-size:1rem;background:var(--soft)}
.lesson .exb .he{padding:10px 16px}
.lesson table{font-size:.92rem}
@media (max-width:560px){ main{gap:20px;padding-top:18px} .card{padding:16px} .q{padding:16px;border-radius:16px} .stem{font-size:1.06rem} .sync{font-size:.7rem} .flash{min-height:250px} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ===== exam mode: mirrors the official computerized interface (English, LTR) ===== */
:root{--x-bar:#e9eef5;--x-blue:#3f6fb5;--x-orange:#e8a23a;--x-row:#f1f3f5;--x-row2:#e6eaed;--x-ink:#1b1f24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--x-bar:#1f2833;--x-blue:#7aa6e6;--x-orange:#e8a23a;--x-row:#20262e;--x-row2:#262d36;--x-ink:#e8ebef}}
:root[data-theme="dark"]{--x-bar:#1f2833;--x-blue:#7aa6e6;--x-orange:#e8a23a;--x-row:#20262e;--x-row2:#262d36;--x-ink:#e8ebef}
.xm{position:fixed;inset:0;z-index:30;background:var(--sheet);color:var(--x-ink);direction:ltr;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.xm-crumbs{display:flex;overflow-x:auto;background:var(--x-bar);font-size:.85rem;scrollbar-width:none;padding-left:env(safe-area-inset-left,0px)}
.xm-crumbs span{padding:6px 18px 6px 22px;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);background:var(--x-row2);margin-right:-6px;color:var(--muted)}
.xm-crumbs span.on{background:var(--x-orange);color:#1b1f24;font-weight:700}
.xm-crumbs span.done{opacity:.6}
.xm-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.xm-logo{font:700 1.15rem Arial,sans-serif;color:var(--x-blue);letter-spacing:.02em}
.xm-logo i{color:var(--x-orange);font-style:italic;font-weight:400}
.xm-pill{border:1.5px solid var(--x-blue);color:var(--x-blue);background:transparent;border-radius:99px;padding:5px 14px;cursor:pointer;font:600 .9rem Arial,sans-serif;min-height:34px}
.xm-nums{display:flex;gap:8px;flex-wrap:wrap}
.xm-nums button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--x-ink);background:transparent;color:var(--x-ink);font:600 .85rem Arial,sans-serif;cursor:pointer;position:relative}
.xm-nums button.ans{background:var(--x-orange);border-color:var(--x-orange);color:#1b1f24}
.xm-nums button.cur::after{content:"";position:absolute;left:6px;right:6px;bottom:-7px;height:3px;background:var(--x-ink)}
.xm-nums button.flag::before{content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:var(--x-blue);border:2px solid var(--sheet)}
.xm-flag{background:none;border:0;color:var(--x-blue);font:700 .9rem Arial,sans-serif;cursor:pointer;min-height:34px}
.xm-flag[aria-pressed="true"]{color:var(--x-orange)}
.xm-clock{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--x-ink);font:700 1.15rem Arial,sans-serif;cursor:pointer;font-variant-numeric:tabular-nums;min-height:34px}
.xm-clock b{width:26px;height:26px;border-radius:50%;border:2px solid var(--x-blue);display:inline-block}
.xm-clock.low{color:var(--bad)}
.xm-next{margin-left:auto;background:var(--x-blue);color:#fff;border:0;border-radius:99px;padding:8px 18px;font:700 .95rem Arial,sans-serif;cursor:pointer;min-height:38px}
.xm-next:disabled{opacity:.45;cursor:not-allowed}
.xm-body{flex:1;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.xm-split{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:1200px;margin:0 auto;align-items:start}
.xm-split > *{min-width:0}
.xm-one{max-width:820px;margin:0 auto}
.xm-left{background:var(--x-row);padding:20px;font-size:1.02rem;line-height:1.7;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:0}
.xm-left h4{margin:0 0 10px;font:700 1.05rem Arial,sans-serif}
.xm-left p{margin:0 0 12px}
.xm-q h3{font:700 1.5rem Arial,sans-serif;color:var(--x-blue);margin:0 0 16px}
.xm-stem{font-size:1.12rem;line-height:1.65;margin-bottom:22px;white-space:pre-wrap}
.xm-opts{display:flex;flex-direction:column;gap:6px}
.xm-opt{display:grid;grid-template-columns:62px 1fr;align-items:stretch;border:0;padding:0;background:none;cursor:pointer;text-align:left;color:var(--x-ink);font:1.05rem/1.5 Arial,sans-serif}
.xm-opt > span{background:var(--x-row);padding:14px 16px;display:flex;align-items:center}
.xm-opt > span:first-child{justify-content:center;background:var(--x-row2);margin-right:2px}
.xm-opt:nth-child(even) > span{background:var(--x-row2)}
.xm-opt i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--x-ink);display:inline-block;background:var(--sheet)}
.xm-opt.sel i{border:6px solid var(--x-blue)}
.xm-opt.sel > span:last-child{outline:2px solid var(--x-blue);outline-offset:-2px}
.xm-arrows{display:flex;justify-content:space-between;margin-top:22px}
.xm-arrows button{border:1.5px solid var(--x-blue);color:var(--x-blue);background:none;border-radius:99px;padding:6px 16px;cursor:pointer;font:600 .9rem Arial,sans-serif;min-height:36px}
.xm-arrows button:disabled{opacity:.35}
.xm-instr{max-width:820px;margin:0 auto;font-size:1.12rem;line-height:1.7}
.xm-wf{font:inherit;border:0;border-bottom:2px solid var(--x-ink);background:transparent;color:var(--x-ink);width:11em;padding:2px 4px;font-size:1.1rem}
.xm-ta{width:100%;min-height:320px;font:1.05rem/1.6 Arial,sans-serif;padding:12px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--x-ink)}
.xm-count{font:700 .95rem Arial,sans-serif;padding:3px 10px;border-radius:99px;color:#fff}
.xm-audio{display:flex;flex-direction:column;gap:12px}
.xm-play{width:56px;height:56px;border-radius:50%;border:0;background:var(--x-blue);color:#fff;font-size:1.4rem;cursor:pointer}
.xm-play:disabled{opacity:.4}
.xm-prog{height:8px;background:var(--x-row2);position:relative}
.xm-prog i{position:absolute;inset-block:0;left:0;background:var(--x-orange)}
.xm-tts{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:31}
.xm-tts button{width:44px;height:44px;border:1.5px solid var(--x-ink);background:var(--sheet);color:var(--x-ink);cursor:pointer;font-size:1rem}
.xm-modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.xm-modal > div{background:var(--sheet);color:var(--x-ink);max-width:460px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;font-family:Arial,sans-serif}
.xm-tabs{display:none;gap:0;margin:-8px 0 14px;border:1.5px solid var(--x-blue);border-radius:99px;overflow:hidden}
.xm-tabs button{flex:1;border:0;background:transparent;color:var(--x-blue);font:700 .95rem Arial,sans-serif;padding:8px;cursor:pointer;min-height:40px}
.xm-tabs button.on{background:var(--x-blue);color:#fff}
@media (max-width:820px){ .xm-split{grid-template-columns:1fr} .xm-left{position:static;max-height:none} .xm-q h3{font-size:1.25rem}
  .xm-tabs{display:flex} .xm-split.show-q > .xm-left{display:none} .xm-split.show-t > .xm-q{display:none} }
@media (max-width:560px){ .xm-logo{display:none} .xm-bar{gap:8px 10px;padding-block:6px} .xm-pill{padding:3px 10px;font-size:.8rem;min-height:30px}
  .xm-nums{gap:6px} .xm-nums button{width:30px;height:30px} .xm-flag{font-size:.82rem} .xm-clock{font-size:1rem} .xm-next{padding:6px 12px;font-size:.85rem;min-height:34px}
  .xm-body{padding-top:16px} .xm-stem{font-size:1.05rem} .xm-opt{grid-template-columns:44px 1fr} .xm-opt > span{padding:12px}
  .xm-tts button{width:36px;height:36px;opacity:.8} .xm-crumbs span{padding:5px 14px 5px 18px;font-size:.78rem} }
</style>

<script>
"use strict";
/* ---------- constants ---------- */
const VIEWS=[["home","בית"],["learn","למידה"],["plan","תוכנית"],["words","מילים"],["practice","תרגול"],["sim","סימולציה"],["past","מבחני עבר"],["log","יומן טעויות"]];
const TYPE_HE={sc:"השלמת משפטים",rs:"ניסוח מחדש",rc:"הבנת הנקרא",gc:"דקדוק בהקשר",wf:"יצירת מילה",ct:"השלמת קטע שמע",lc:"הרצאה/שיחה",wr:"מטלת כתיבה"};
const TYPE_EN={sc:"Sentence Completion",rs:"Restatement",rc:"Text and Questions",gc:"Grammar in Context",wf:"Word Formation",ct:"Listening Text Continuation",lc:"Lecture + Questions",wr:"Essay"};
// paraphrased section instructions (shown via Show Instructions, as in the real interface)
const INSTR={
 sc:"This section consists of sentences with a word or words missing. For each question, choose the answer that <b>best completes the sentence</b>.",
 rs:"Each question in this section presents a sentence followed by four possible ways of restating it. Choose the answer that <b>best restates the meaning</b> of the original sentence.",
 rc:"Read the text and answer the questions that follow. For each question, choose the <b>most appropriate answer</b> according to the text.",
 gc:"Each question contains a short text with a missing part. Choose the answer that is <b>grammatically correct</b> and fits the context.",
 wf:"Each sentence has a missing word. Click in the blank and <b>type the correct form</b> of the word in brackets. Use letters only.",
 ct:"You will hear the beginning of a short talk. Press play to listen, then choose the <b>most suitable continuation</b>.",
 lc:"You will hear several recordings. Press play to listen to each recording, then answer the questions about it.",
 wr:"Read the task and type your response in the box. The word counter turns <b>green</b> when your response is within the required length."};
// official per-chapter sizes and times (NITE presentation)
const CH_SPEC={sc:[4,240],rs:[3,360],rc:[5,900],gc:[4,240],wf:[4,180],ct:[4,240],lc:[5,420],wr:[1,720]};
const CATS=[["word","מילה לא מוכרת"],["trap","מלכודת"],["careless","קריאה רשלנית"],["time","זמן"]];
const CAT_HE=Object.fromEntries(CATS);
const BOX_DAYS=[0,1,2,4,8,16,32];
const SEASON_HE={winter:"חורף",spring:"אביב",summer:"קיץ",autumn:"סתיו"};
// English raw/44 → scale, NITE summer 2025 table; fallback when an exam lacks its own table
const CONV_FALLBACK={20:88,21:91,22:93,23:96,24:98,25:101,26:103,27:106,28:108,29:111,30:113,31:115,32:118,33:120,34:123,35:125,36:127,37:130,38:132,39:135,40:138,41:141,42:144,43:147,44:150};
const AMIRNET_SIM="https://amirnet-practice.nite.org.il/amirnet.html";

/* ---------- state ---------- */
const S={plan:{},srs:{},intro:{day:0,n:0},stats:{sc:{n:0,c:0},rs:{n:0,c:0},rc:{n:0,c:0}},days:{},results:[],errors:[],seen:{},gen:[],lessons:{},essays:[],daily:{},settings:{start:null,test:null,daily:30,pace:"amirnet",target:134},updatedAt:0};
const LS="amirnet-app-v1";
const C={vocab:[],sc:[],rs:[],rc:[],keys:[],gc:[],wf:[],ct:[],lc:[],wr:[],lessons:[]}; // content
let VBY={}; // vocab by word
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};
const dayStr=n=>new Date(n*864e5).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);

function loadLocal(){try{const x=JSON.parse(localStorage.getItem(LS)||"null");if(x)merge(x)}catch(e){}}
function merge(x){for(const k of Object.keys(S)) if(x[k]!==undefined) S[k]=x[k]; S.settings=Object.assign({start:null,test:null,daily:30,pace:"amirnet",target:134},S.settings||{}); S.lessons=S.lessons||{}; S.essays=S.essays||[]; S.daily=S.daily||{};}
function trim(){const dk=Object.keys(S.daily||{}).map(Number).sort((a,b)=>a-b);while(dk.length>30)delete S.daily[dk.shift()];S.results=S.results.slice(-300);S.errors=S.errors.slice(-400);S.gen=S.gen.slice(-150);S.essays=S.essays.slice(-20);}
let pushTimer=null;
function save(){S.updatedAt=Date.now();trim();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} clearTimeout(pushTimer);pushTimer=setTimeout(pushRemote,1500);}
let remote=null,pushing=false,pushAgain=false;
function setSync(t){const el=$("#sync");el.textContent=t;el.classList.toggle("on",/מסונכרן/.test(t))}
async function pushRemote(){
  if(!remote)return; if(pushing){pushAgain=true;return}
  pushing=true;setSync("שומר…");
  try{await remote.set(JSON.parse(JSON.stringify(S)));setSync("מסונכרן לחשבון")}
  catch(e){ if(e&&e.code==="invalid_argument"){remote=null;setSync("שמור במכשיר")} else setSync("לא נשמר בענן") }
  pushing=false; if(pushAgain){pushAgain=false;pushRemote()}
}
/* ---------- Firebase accounts (levy-platform.com build only; inert inside claude.ai) ---------- */
let FB=null; const OWNER_KEY="amirnet-owner";
const FB_ERR={"auth/invalid-email":"כתובת האימייל לא תקינה.","auth/missing-password":"צריך להזין סיסמה.","auth/weak-password":"הסיסמה צריכה להכיל לפחות 6 תווים.","auth/email-already-in-use":"כבר יש חשבון עם האימייל הזה. אפשר להתחבר.","auth/invalid-credential":"האימייל או הסיסמה שגויים.","auth/wrong-password":"האימייל או הסיסמה שגויים.","auth/user-not-found":"לא נמצא חשבון עם האימייל הזה.","auth/too-many-requests":"יותר מדי ניסיונות. כדאי לנסות שוב בעוד כמה דקות.","auth/network-request-failed":"אין חיבור לאינטרנט. כדאי לנסות שוב."};
function resetState(){const fresh={plan:{},srs:{},intro:{day:0,n:0},stats:{sc:{n:0,c:0},rs:{n:0,c:0},rc:{n:0,c:0}},days:{},results:[],errors:[],seen:{},gen:[],lessons:{},essays:[],daily:{},settings:{},updatedAt:0};merge(fresh);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function initFirebase(){
  if(window.claude||!window.firebase||!window.FIREBASE_CONFIG)return;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const auth=firebase.auth(), db=firebase.firestore();
    if(window.FIREBASE_EMULATOR){auth.useEmulator("http://127.0.0.1:9099");db.useEmulator("127.0.0.1",8080)}
    FB={auth,db,user:null,msg:"",busy:false,mode:"in"};
    auth.onAuthStateChanged(async u=>{
      FB.user=u;
      if(!u){remote=null;setSync("שמור במכשיר");if(!XM)render();return}
      let owner=null;try{owner=localStorage.getItem(OWNER_KEY)}catch(e){}
      if(owner&&owner!==u.uid) resetState(); // another account used this browser before
      try{localStorage.setItem(OWNER_KEY,u.uid)}catch(e){}
      const ref=db.doc("users/"+u.uid+"/data/state");
      remote={set:o=>ref.set(o)};
      try{
        const snap=await ref.get();
        if(snap.exists){const r=snap.data(); if((r.updatedAt||0)>S.updatedAt){merge(JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}} else if(S.updatedAt>(r.updatedAt||0)) pushRemote(); setSync("מסונכרן לחשבון")}
        else if(S.updatedAt) pushRemote(); else setSync("מסונכרן לחשבון");
      }catch(e){remote=null;setSync("לא נשמר בענן")}
      if(!XM)render();
    });
  }catch(e){FB=null}
}
function accountHtml(){
  if(FB.user) return `<p class="small">מחובר בתור <b class="en">${esc(FB.user.email||"")}</b>. ההתקדמות נשמרת בחשבון ומסונכרנת בכל מכשיר שבו תתחבר.</p><div class="row"><button class="btn sm ghost" id="fbOut">התנתק</button></div>`;
  const up=FB.mode==="up";
  return `<p class="small">${up?"יצירת חשבון חינם. ההתקדמות תישמר בענן ותהיה זמינה בטלפון ובמחשב.":"התחבר כדי שההתקדמות תישמר ותסונכרן בין המכשירים. בלי חשבון היא נשמרת רק בדפדפן הזה."}</p>
  <form id="fbForm" class="stack" style="gap:10px;max-width:360px" novalidate>
    <label class="f">אימייל<input type="email" id="fbEmail" autocomplete="email" dir="ltr" required></label>
    <label class="f">סיסמה${up?" (לפחות 6 תווים)":""}<input type="password" id="fbPw" autocomplete="${up?"new-password":"current-password"}" dir="ltr" required></label>
    <div class="row"><button class="btn" type="submit" ${FB.busy?"disabled":""}>${up?"צור חשבון":"התחבר"}</button><button class="btn ghost sm" type="button" id="fbMode">${up?"יש לי כבר חשבון":"אין לי חשבון"}</button>${up?"":`<button class="btn ghost sm" type="button" id="fbReset">שכחתי סיסמה</button>`}</div>
    <span class="small ${FB.msgOk?"ok-t":"no-t"}" id="fbMsg">${esc(FB.msg||"")}</span>
  </form>`;
}
function bindAccount(app){
  const out=app.querySelector("#fbOut"); if(out) out.onclick=async()=>{await FB.auth.signOut();resetState();try{localStorage.removeItem(OWNER_KEY)}catch(e){}render()};
  const f=app.querySelector("#fbForm"); if(!f) return;
  const say=(t,ok)=>{FB.msg=t;FB.msgOk=!!ok;const m=app.querySelector("#fbMsg");if(m){m.textContent=t;m.className="small "+(ok?"ok-t":"no-t")}};
  app.querySelector("#fbMode").onclick=()=>{FB.mode=FB.mode==="up"?"in":"up";FB.msg="";render()};
  const rs=app.querySelector("#fbReset"); if(rs) rs.onclick=async()=>{const em=app.querySelector("#fbEmail").value.trim();if(!em){say("כתוב את האימייל שלך ואז לחץ שוב על \"שכחתי סיסמה\".");return}try{await FB.auth.sendPasswordResetEmail(em);say("נשלח אליך מייל לאיפוס הסיסמה.",true)}catch(e){say(FB_ERR[e.code]||"לא הצלחנו לשלוח מייל איפוס.")}};
  f.onsubmit=async e=>{e.preventDefault();const em=app.querySelector("#fbEmail").value.trim(),pw=app.querySelector("#fbPw").value;FB.busy=true;say("…",true);
    try{ if(FB.mode==="up") await FB.auth.createUserWithEmailAndPassword(em,pw); else await FB.auth.signInWithEmailAndPassword(em,pw); FB.msg=""; }
    catch(err){say(FB_ERR[err.code]||"משהו השתבש. כדאי לנסות שוב.")}
    FB.busy=false;};
}
async function initRemote(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return; const id=await user.id(); if(!id)return;
    remote=db.doc("data/users/"+id+"/state");
    const snap=await remote.get();
    if(snap.exists){const r=snap.data(); if((r.updatedAt||0)>S.updatedAt){merge(JSON.parse(JSON.stringify(r)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} render()} else if(S.updatedAt>(r.updatedAt||0)) pushRemote(); else setSync("מסונכרן לחשבון")}
    else if(S.updatedAt) pushRemote(); else setSync("מסונכרן לחשבון");
  }catch(e){remote=null}
}
let sampleFn=null;
async function initSample(){ if(!window.claude||!window.claude.use)return; try{sampleFn=await claude.use("sample")}catch(e){sampleFn=null} if(sampleFn&&(view==="practice"||view==="sim"))render(); }
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}

/* ---------- content loading ---------- */
async function getJSON(f){try{const r=await fetch(f);if(!r.ok)throw 0;return await r.json()}catch(e){return null}}
async function loadContent(){

  if(past.length) return {score:Math.round(past.reduce((s,r)=>s+r.score,0)/past.length),src:`ממוצע ${past.length} מבחני העבר האחרונים`,sure:"גבוהה"};
  const sims=S.results.filter(r=>r.kind==="sim").slice(-3);
  if(sims.length) return {score:Math.round(sims.reduce((s,r)=>s+r.score,0)/sims.length),src:`ממוצע ${sims.length} הסימולציות האחרונות`,sure:"בינונית"};
  const t=["sc","rs","rc"].map(k=>S.stats[k]||{n:0,c:0}); const n=t.reduce((s,x)=>s+x.n,0);
  if(n>=20){const acc=t.reduce((s,x)=>s+x.c,0)/n; return {score:Math.round(50+100*acc*0.85),src:`לפי ${n} שאלות תרגול`,sure:"נמוכה"}}

}

}

  if(scores.length<1)return `<div class="empty">אחרי מבחן העבר או הסימולציה הראשונים יופיע כאן גרף הציונים, עם קו יעד ב-134.</div>`;
  const pts=scores.slice(-20),W=640,H=180,pl=34,pr=10,pt=10,pb=22;
  const x=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)), y=s=>pt+(150-s)*(H-pt-pb)/100;
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join("");
  const grid=[50,88,104,120,134,150].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" ${v===134?'stroke="var(--good)" stroke-dasharray="5 4"':''}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");

  return `<div class="scroll" style="direction:ltr"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:360px" role="img" aria-label="גרף ציונים">${grid}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg></div><p class="small muted">כחול: מבחני עבר. שחור: סימולציות באתר. הקו הירוק המקווקו: 134 (פטור).</p>`;

function alphaSort(x){ // the real test lists sentence-completion options alphabetically
  const idx=x.o.map((o,i)=>i).sort((i,j)=>String(x.o[i]).toLowerCase().localeCompare(String(x.o[j]).toLowerCase()));
  return Object.assign({},x,{o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a)});
}
function nearest(pool,d,n,used){
  const p=pool.filter(x=>!used||!used.has(x.id));
  return shuffle(p).sort((a,b)=>(d?Math.abs((a.d||2)-d)-Math.abs((b.d||2)-d):0)||seenOf(a.id)-seenOf(b.id)).slice(0,n);
}
const CT_CONTEXT="You will hear the beginning of a short talk.";
// returns {items, passage?, clips?, d}
function pickChapter(type,d,n,used){
  n=n||CH_SPEC[type][0];
  if(type==="sc"){const it=nearest(allSC(),d,n,used).sort((a,b)=>(a.d||2)-(b.d||2));return{items:it.map(x=>Object.assign(alphaSort(x),{kind:"mc"})),d}}
  if(type==="rs"){const it=nearest(allRS(),d,n,used).sort((a,b)=>(a.d||2)-(b.d||2));return{items:it.map(x=>Object.assign({},x,{kind:"mc"})),d}}
  if(type==="gc"){return{items:nearest(C.gc,d,n,used).map(x=>Object.assign({},x,{kind:"mc"})),d}}
  if(type==="wf"){return{items:nearest(C.wf,d,n,used).map(x=>Object.assign({},x,{kind:"wf"})),d}}
  if(type==="ct"){return{items:nearest(C.ct,0,n,used).map(x=>Object.assign({},x,{kind:"mc",context:CT_CONTEXT})),d:2}}
  if(type==="rc"){const p=nearest(C.rc,d,1,used)[0]; if(!p)return{items:[]}; return{passage:p,d:p.d,items:p.qs.slice(0,5).map((q,i)=>Object.assign({id:p.id+"_"+i,kind:"mc"},q))}}
  if(type==="lc"){const s=nearest(C.lc,0,1,used)[0]; if(!s)return{items:[]}; const items=[]; s.clips.forEach((c,ci)=>c.qs.forEach((q,qi)=>items.push(Object.assign({id:s.id+"_"+ci+"_"+qi,kind:"mc",clip:ci},q)))); return{setId:s.id,clips:s.clips,items,d:2}}
  if(type==="wr"){const w=nearest(C.wr,0,1,used)[0]; if(!w)return{items:[]}; return{items:[Object.assign({},w,{kind:"wr"})],d:2}}
  return{items:[]};
}
const normWord=s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
function isCorrect(it,ans){
  if(it.kind==="mc")return ans===it.a;
  if(it.kind==="wf")return (it.ans||[]).some(a=>normWord(a)===normWord(ans));
  return null;
}
const countWords=t=>(String(t||"").trim().match(/[A-Za-z0-9'’-]+/g)||[]).length;

/* ---------- text to speech (listening items) ---------- */
let TTS={on:false,timer:null};
function ttsVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return[]}}
function ttsStop(){try{speechSynthesis.cancel()}catch(e){} clearInterval(TTS.timer); TTS.on=false;}
function speak(script,onProg,onEnd){
  if(!("speechSynthesis" in window)){onEnd&&onEnd(false);return}
  ttsStop();
  const lines=String(script).split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const voices=ttsVoices(); const pref=voices.filter(v=>/en-US/i.test(v.lang)); const pool=pref.length?pref:voices;
  const spk={}; let vi=0;
  const parts=lines.map(l=>{const m=l.match(/^([A-Z][A-Za-z .]{0,20}):\s*(.*)$/);if(m){if(!(m[1] in spk))spk[m[1]]=vi++;return{t:m[2],s:spk[m[1]]}}return{t:l,s:0}});
  const total=Math.max(1,countWords(script)/2.4); const t0=Date.now(); TTS.on=true;
  TTS.timer=setInterval(()=>{onProg&&onProg(Math.min(1,(Date.now()-t0)/1000/total))},250);
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.t);u.lang="en-US";u.rate=.95;
    if(pool.length)u.voice=pool[p.s%pool.length]; if(!pool.length||pool.length<2)u.pitch=p.s%2?0.8:1.1;
    if(i===parts.length-1)u.onend=()=>{clearInterval(TTS.timer);TTS.on=false;onProg&&onProg(1);onEnd&&onEnd(true)};
    speechSynthesis.speak(u)});
}
function speakSelection(){const t=String(window.getSelection?getSelection():"").trim(); if(t) speak(t)}

/* ---------- grading + review shared by exam-format practice and simulation ---------- */
function gradeChapters(chs,src,scoredIdx){
  const out=[];
  chs.forEach((c,ci)=>c.items.forEach((x,i)=>{
    const ans=c.pick[i]; const ok=isCorrect(x,ans);
    if(ok!==null){ if(!scoredIdx||scoredIdx.includes(ci)) logActivity(c.type,ok); }
    markSeen(c.passage?c.passage.id:c.setId||x.id);
    if(ok===false) S.errors.push({t:Date.now(),src,type:c.type,ref:x.id,q:String(x.q||"").slice(0,700),pick:x.kind==="mc"?(ans??-1):-1,a:x.kind==="mc"?x.a:-1,o:x.kind==="mc"?x.o:null,typed:x.kind==="wf"?String(ans||""):undefined,acc:x.kind==="wf"?x.ans:undefined,ex:x.ex||"",cat:null});
    if(x.kind==="wr"&&String(ans||"").trim()) S.essays.push({t:Date.now(),id:x.id,prompt:x.prompt,text:String(ans),words:countWords(ans)});
    out.push({ci,i,ok});
  }));
  return out;
}

/* =========================================================
   SIMULATION (full Amirnet structure, adaptive)
   ========================================================= */
let SM=null; let SIMCFG={exp:true};
function simPlan(){
  const base=["sc","sc","rc","rs","rs","sc"]; if(!SIMCFG.exp) return base;
  const have=["gc","wf","ct","lc"].filter(t=>(C[t]||[]).length);
  if(C.wr.length&&(Math.random()<.25||have.length<2)) return base.concat(["wr"]);
  if(have.length<2) return base;
  return base.concat(shuffle(have).slice(0,2));
}
function simLevel(chs){
  const scored=chs.filter((c,i)=>i<6); if(!scored.length)return 2;
  const last=scored[scored.length-1]; const p=last.items.filter((x,i)=>isCorrect(x,last.pick[i])).length/last.items.length;
  return Math.max(1,Math.min(3,(last.d||2)+(p>=0.75?1:p<0.5?-1:0)));
}
function simScoreOf(chs){
  const all=[]; chs.slice(0,6).forEach(c=>c.items.forEach((x,i)=>all.push({ok:isCorrect(x,c.pick[i]),d:x.d||c.d||2})));
  const p=all.filter(x=>x.ok).length/all.length; const avgD=all.reduce((s,x)=>s+x.d,0)/all.length;
  let base=50+100*(p*0.78+(avgD-1)*0.11);
  const exp=chs.slice(6).flatMap(c=>c.items.map((x,i)=>isCorrect(x,c.pick[i]))).filter(v=>v!==null);
  const bonus=exp.length?2*exp.filter(Boolean).length/exp.length:0;
  return {p,avgD,bonus:Math.round(bonus*10)/10,score:Math.round(Math.max(50,Math.min(150,base+bonus))),correct:all.filter(x=>x.ok).length,total:all.length};
}

  if(SM&&SM.done) return simResults(app);
  const enough=allSC().length>=12&&allRS().length>=6&&C.rc.length>=1;

let LG={type:"all",cat:"all"};
// mistakes that can be re-asked on their own (no passage or recording needed)
// rebuild a practice entry for a logged mistake from the current content (passage / recording included)
function resolveErr(e){
  const base={type:e.type,retry:true};
  const find=(arr,id)=>(arr||[]).find(x=>x.id===id);
  if(e.type==="sc"){const x=find(allSC(),e.ref);if(x)return Object.assign(base,{it:Object.assign(alphaSort(x),{kind:"mc"})})}
  if(e.type==="rs"){const x=find(allRS(),e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"mc"})})}
  if(e.type==="gc"){const x=find(C.gc,e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"mc"})})}
  if(e.type==="wf"){const x=find(C.wf,e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"wf"})})}
  if(e.type==="ct"){const x=find(C.ct,e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"mc"}),clip:{context:CT_CONTEXT,script:x.script}})}
  if(e.type==="rc"){const m=String(e.ref).match(/^(.*)_(\d+)$/);const p=m&&find(C.rc,m[1]);const q=p&&p.qs[+m[2]];if(q)return Object.assign(base,{p,it:Object.assign({id:e.ref,kind:"mc"},q)})}
  if(e.type==="lc"){const m=String(e.ref).match(/^(.*)_(\d+)_(\d+)$/);const st=m&&find(C.lc,m[1]);const c=st&&st.clips[+m[2]];const q=c&&c.qs[+m[3]];if(q)return Object.assign(base,{clip:c,setId:st.id,it:Object.assign({id:e.ref,kind:"mc"},q)})}
  if(e.o||e.acc) return Object.assign(base,{it:{id:e.ref,kind:e.acc?"wf":"mc",q:e.q,o:e.o,a:e.a,ans:e.acc,ex:e.ex}});
  return null;
}
function retryPool(){const seen=new Set();return S.errors.filter(e=>e.src!=="past"&&!seen.has(e.ref)&&seen.add(e.ref)).map(resolveErr).filter(Boolean)}

  <div class="row"><div class="seg">${[["all","כל הסוגים"],["sc","השלמה"],["rs","ניסוח מחדש"],["rc","קריאה"]].map(([k,t])=>`<button class="chip" data-lt="${k}" aria-pressed="${LG.type===k}">${t}</button>`).join("")}</div>
  <div class="seg">${[["all","כל הסיבות"],["none","לא סווג"],...CATS].map(([k,t])=>`<button class="chip" data-lc="${k}" aria-pressed="${LG.cat===k}">${t}</button>`).join("")}</div></div>
  <div class="stack">${list.slice(0,80).map(e=>{const idx=E.indexOf(e);return `<details class="card"><summary class="row" style="justify-content:space-between"><span>${TYPE_HE[e.type]||""} · <span class="muted small">${new Date(e.t).toLocaleDateString("he-IL")} · ${{practice:"תרגול",sim:"סימולציה",past:"מבחן עבר"}[e.src]||""}</span></span>${e.cat?`<span class="pill">${CAT_HE[e.cat]}</span>`:`<span class="pill warn-t">לא סווג</span>`}</summary>
    ${e.o?`<div class="stem">${stemHtml(e.q)}</div><div class="opts">${e.o.map((o,k)=>`<div class="opt ${k===e.a?"ok":k===e.pick?"no":""}"><span class="bub">${k+1}</span><span>${esc(o)}</span></div>`).join("")}</div>${e.ex?`<div class="explain">${esc(e.ex)}</div>`:""}`:(e.acc?`<div class="stem">${esc(e.q)}</div><p>כתבת: <b class="en">${esc(e.typed||"—")}</b> · נכון: <b class="en">${esc(e.acc.join(" / "))}</b></p>${e.ex?`<div class="explain">${esc(e.ex)}</div>`:""}`:`<p>${esc(e.q)} · סימנת ${e.pick>=0?e.pick+1:"—"}, התשובה הנכונה ${e.a+1}</p>`)}

  :`<div class="empty">היומן ריק. כל טעות בתרגול, בסימולציה או במבחן עבר תיכנס לכאן אוטומטית, ותוכל לסווג אותה לפי הסיבה.</div>`}`;

  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.errors.splice(+b.dataset.del,1);save();render()});
}
