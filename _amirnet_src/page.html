<title>מכינת אמירנט</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: modern study app (Duolingo/Quizlet language) — bright indigo primary, chunky 3D buttons, 2px bordered cards with a depth edge,
   bottom tab bar on phones, slide-up feedback sheet after every answer. Type: Rubik (Hebrew UI), Lexend (English content). */
:root{
  --paper:#F5F6FB; --sheet:#FFFFFF; --ink:#111827; --muted:#4B5563; --rule:#E3E6EF; --soft:#F0F2F8;
  --primary:#4F46E5; --primary-dark:#3B32C4; --primary-soft:#EEEFFF; --on-primary:#FFFFFF;
  --accent:#4F46E5; --accent-fill:#4F46E5; --accent-ink:#FFFFFF; --mark:#EEEFFF;
  --good:#15803D; --good-fill:#22A55A; --good-dark:#178045; --good-bg:#E7F8EE;
  --bad:#C62828; --bad-fill:#E5484D; --bad-dark:#C0393E; --bad-bg:#FDECEC; --warn:#B45309;
  --amber:#F59E0B; --sky:#0EA5E9; --pink:#DB2777; --teal:#0D9488; --violet:#7C3AED; --orange:#EA580C;
  --shadow:0 12px 32px rgba(17,24,39,.08); --shadow-sm:0 1px 2px rgba(17,24,39,.05);
  --r:20px; --r-sm:14px; --edge:4px;
  --display:"Rubik","Heebo","Arial Hebrew",system-ui,sans-serif;
  --body:"Rubik","Heebo","Arial Hebrew",system-ui,sans-serif;
  --en:"Lexend","Helvetica Neue",Arial,sans-serif;
  --mono:"Rubik",system-ui,sans-serif;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1020; --sheet:#151B2E; --ink:#F3F4F8; --muted:#A6AEC2; --rule:#28304A; --soft:#1C2338;
  --primary:#7C83FF; --primary-dark:#5A61E0; --primary-soft:#22284A; --on-primary:#0C1020;
  --accent:#9BA1FF; --accent-fill:#7C83FF; --accent-ink:#0C1020; --mark:#22284A;
  --good:#5FD08F; --good-fill:#2FB36A; --good-dark:#218A50; --good-bg:#132A20;
  --bad:#FF8A8F; --bad-fill:#E5484D; --bad-dark:#B4363A; --bad-bg:#33181C; --warn:#F5B454;
  --shadow:0 12px 32px rgba(0,0,0,.4); --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0C1020; --sheet:#151B2E; --ink:#F3F4F8; --muted:#A6AEC2; --rule:#28304A; --soft:#1C2338;
  --primary:#7C83FF; --primary-dark:#5A61E0; --primary-soft:#22284A; --on-primary:#0C1020;
  --accent:#9BA1FF; --accent-fill:#7C83FF; --accent-ink:#0C1020; --mark:#22284A;
  --good:#5FD08F; --good-fill:#2FB36A; --good-dark:#218A50; --good-bg:#132A20;
  --bad:#FF8A8F; --bad-fill:#E5484D; --bad-dark:#B4363A; --bad-bg:#33181C; --warn:#F5B454;
  --shadow:0 12px 32px rgba(0,0,0,.4); --shadow-sm:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
html{direction:rtl;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16.5px/1.6 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,5.2vw,2.2rem);font-weight:800;letter-spacing:-.4px}
h2{font-size:clamp(1.2rem,3.6vw,1.45rem);font-weight:700;letter-spacing:-.2px}
h3{font:700 1.04rem/1.35 var(--body);margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--primary);text-underline-offset:3px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;border-radius:10px}
.num{font-family:var(--body);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--en);text-align:left}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header + navigation ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--sheet) 88%,transparent);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.08rem var(--display);white-space:nowrap;letter-spacing:-.2px}
.brand .logo{width:34px;height:34px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;font:800 1.05rem var(--en);box-shadow:0 3px 0 var(--primary-dark)}
.brand b{display:none}
nav#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav#nav::-webkit-scrollbar{display:none}
nav#nav button{display:flex;align-items:center;gap:7px;background:none;border:0;padding:9px 13px;border-radius:12px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600;font-size:.94rem;transition:background .15s,color .15s}
nav#nav button .ico{display:none}
nav#nav button:hover{background:var(--soft);color:var(--ink)}
nav#nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
@media (max-width:1100px){ nav#nav button{padding:8px 10px;font-size:.9rem} }
.sync{font:500 .76rem var(--body);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rule);box-shadow:0 0 0 2px var(--soft)}
.sync.on::before{background:var(--good-fill)}
@media (min-width:761px) and (max-width:960px){ .sync{font-size:0;gap:0} }
.bnav{display:none}
.sheet-menu{position:fixed;inset:0;z-index:25;background:rgba(12,16,32,.45);display:flex;align-items:flex-end;animation:fade .18s}
.sheet-menu > div{background:var(--sheet);width:100%;border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:var(--shadow);animation:up .22s ease-out}
.sheet-menu .grab{grid-column:1/-1;width:44px;height:5px;border-radius:99px;background:var(--rule);margin:2px auto 8px}
.sheet-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--soft);border:2px solid var(--rule);border-bottom-width:var(--edge);padding:16px;border-radius:var(--r-sm);font-weight:700;font-size:1rem;cursor:pointer;text-align:right;min-height:96px}
.sheet-menu button .ico{width:28px;height:28px;color:var(--primary)}
.sheet-menu button[aria-current="page"]{border-color:var(--primary);background:var(--primary-soft)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:760px){
  nav#nav{display:none}
  .top-in{min-height:56px;justify-content:space-between}
  .bnav{display:flex;position:fixed;inset:auto 0 0;z-index:12;background:var(--sheet);border-top:1px solid var(--rule);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -6px 24px rgba(17,24,39,.05)}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px 2px;color:var(--muted);font:600 .7rem var(--body);cursor:pointer;min-height:54px}
  .bnav button .ico{width:44px;height:30px;padding:4px 10px;border-radius:99px;transition:background .15s,color .15s}
  .bnav button[aria-current="page"]{color:var(--primary)}
  .bnav button[aria-current="page"] .ico{background:var(--primary-soft);stroke-width:2.3}
  main#app{padding-bottom:calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))!important}
  .fb{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))!important}
  body.focus .bnav{display:none}
  body.focus .fb{bottom:0!important}
  body.focus main#app{padding-bottom:40px!important}
}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{white-space:nowrap;flex:none}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.grid > *{min-width:0}
.card{background:var(--sheet);border:2px solid var(--rule);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
button.card{font:inherit;color:inherit;border-bottom-width:var(--edge);transition:transform .12s,border-color .15s,background .15s;cursor:pointer}
button.card:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--rule))}
button.card:active{transform:translateY(2px);border-bottom-width:2px;margin-top:2px}
.tile b{font:800 1.9rem/1.1 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.tile span{color:var(--muted);font-size:.88rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.section-title{font:700 1.02rem var(--body);color:var(--muted);margin-bottom:-6px}

/* ---------- buttons: chunky with a depth edge ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border:0;border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;min-height:50px;box-shadow:0 var(--edge) 0 var(--primary-dark);transition:transform .08s,box-shadow .08s,filter .15s;margin-bottom:var(--edge)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(var(--edge));box-shadow:0 0 0 var(--primary-dark)}
.btn.ghost{background:var(--sheet);color:var(--ink);box-shadow:0 0 0 2px var(--rule) inset,0 var(--edge) 0 var(--rule)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--rule) inset,0 0 0 var(--rule)}
.btn.good{background:var(--good-fill);color:#fff;box-shadow:0 var(--edge) 0 var(--good-dark)}
.btn.bad{background:var(--bad-fill);color:#fff;box-shadow:0 var(--edge) 0 var(--bad-dark)}
.btn.accent{background:var(--primary);color:var(--on-primary)}
.btn.sm{padding:7px 14px;min-height:40px;font-size:.9rem;--edge:3px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.chip{border:2px solid var(--rule);background:var(--sheet);padding:7px 14px;border-radius:12px;cursor:pointer;font-size:.92rem;font-weight:600;min-height:42px;transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--rule))}
.chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;color:var(--muted)}
input[type=date],input[type=number],input[type=search],input[type=email],input[type=password],select,textarea{border:2px solid var(--rule);background:var(--sheet);border-radius:var(--r-sm);padding:10px 12px;min-height:48px;font-size:16px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
textarea{min-height:70px;width:100%}

/* ---------- home ---------- */
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--sheet);border:2px solid var(--rule);font:700 .9rem var(--body)}
.badge .ico{width:18px;height:18px}
.badge.fire{color:var(--orange)} .badge.cal{color:var(--primary)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#5B52F0 0%,#4338CA 60%,#3730A3 100%);box-shadow:0 14px 34px rgba(67,56,202,.28);display:flex;flex-direction:column;gap:14px}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .muted{color:rgba(255,255,255,.78)}
.hero h2{color:#fff}
.hero .btn{background:#fff;color:#3730A3;box-shadow:0 var(--edge) 0 rgba(0,0,0,.18)}
.hero .steps{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero .step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.1);cursor:pointer;border:0;color:#fff;text-align:right;font:inherit;min-height:52px;transition:background .15s}
.hero .step:hover{background:rgba(255,255,255,.17)}
.hero .step .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.6);display:grid;place-items:center}
.hero .step.done .dot{background:#5FD08F;border-color:#5FD08F}
.hero .step.done .dot svg{width:15px;height:15px;stroke:#0C1020;stroke-width:3}
.hero .step .t{font-weight:700;display:block}
.hero .step .d{font-size:.84rem;color:rgba(255,255,255,.75);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.quick{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qt{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:right;padding:16px;min-height:132px}
.qt .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.qt .ic .ico{width:24px;height:24px}
.qt b{font-size:1rem}
.qt span{font-size:.84rem;color:var(--muted);line-height:1.4}
.c-words{background:var(--orange)} .c-sc{background:var(--primary)} .c-rs{background:var(--teal)} .c-rc{background:var(--sky)} .c-sim{background:var(--violet)} .c-past{background:var(--pink)} .c-log{background:var(--bad-fill)} .c-learn{background:var(--good-fill)}
.ring{flex:none}

/* ---------- question ---------- */
.q{background:var(--sheet);border:2px solid var(--rule);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:18px}
.q-meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted);font-weight:600}
.progress{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;border-radius:99px;background:var(--good-fill);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.25);transition:width .35s ease}
.stem{font:400 1.16rem/1.7 var(--en);direction:ltr;text-align:left;letter-spacing:-.01em}
.stem .blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--primary);margin-inline:2px;border-radius:2px}
.opts{display:flex;flex-direction:column;gap:10px;direction:ltr}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:13px 16px;border:2px solid var(--rule);border-bottom-width:var(--edge);border-radius:var(--r-sm);background:var(--sheet);cursor:pointer;font:500 1.03rem/1.5 var(--en);min-height:58px;color:var(--ink);transition:border-color .12s,background .12s,transform .08s}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--primary) 45%,var(--rule));background:var(--soft)}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.opt .bub{flex:none;width:30px;height:30px;border:2px solid var(--rule);border-radius:9px;display:grid;place-items:center;font:700 .85rem var(--body);color:var(--muted)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)} .opt.sel .bub{border-color:var(--primary);color:var(--primary)}
.opt.ok{border-color:var(--good-fill);background:var(--good-bg);color:var(--ink)}
.opt.ok .bub{background:var(--good-fill);border-color:var(--good-fill);color:#fff}
.opt.no{border-color:var(--bad-fill);background:var(--bad-bg)}
.opt.no .bub{background:var(--bad-fill);border-color:var(--bad-fill);color:#fff}
.opt:disabled{cursor:default}
.explain{border-radius:var(--r-sm);padding:14px 16px;background:var(--soft);display:flex;flex-direction:column;gap:8px;line-height:1.7}
.ai{white-space:pre-wrap}
.passage{background:var(--sheet);border:2px solid var(--rule);border-radius:var(--r);padding:20px 22px;font:400 1rem/1.85 var(--en);direction:ltr;text-align:left;display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow:auto}
.passage h3{font:600 1.08rem var(--en)}
.passage p b{font:700 .75rem var(--body);color:var(--primary);margin-right:6px}
.timer{display:inline-flex;align-items:center;gap:6px;font:700 1.05rem var(--body);font-variant-numeric:tabular-nums;padding:6px 14px;border:2px solid var(--rule);border-radius:99px;background:var(--sheet)}
.timer.low{border-color:var(--bad-fill);color:var(--bad)}
.qbar{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.qbar button{width:40px;height:40px;border:2px solid var(--rule);border-radius:12px;background:var(--sheet);font:700 .9rem var(--body);cursor:pointer}
.qbar button.done{background:var(--primary-soft);border-color:var(--primary)}
.qbar button.cur{outline:3px solid var(--primary)}
.cat{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* slide-up feedback after each answer */
.fb{position:fixed;inset:auto 0 0;z-index:11;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid;animation:up .22s ease-out;max-height:58vh;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.fb.ok{background:var(--good-bg);border-color:color-mix(in srgb,var(--good-fill) 50%,transparent)}
.fb.no{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad-fill) 50%,transparent)}
.fb-in{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb-scroll{overflow:auto;min-height:0;flex:1}
.fb-foot{flex:none}
.fb-title{display:flex;align-items:center;gap:10px;font:800 1.3rem var(--display)}
.fb.ok .fb-title{color:var(--good)} .fb.no .fb-title{color:var(--bad)}
.fb-title .badge-i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fb.ok .badge-i{background:var(--good-fill)} .fb.no .badge-i{background:var(--bad-fill)}
.fb-title .badge-i svg{width:20px;height:20px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fb .explain{background:color-mix(in srgb,var(--sheet) 70%,transparent)}
.fb-pad{height:52vh}


/* ---------- flashcard ---------- */
.flash{background:var(--sheet);border:2px solid var(--rule);border-bottom-width:6px;border-radius:26px;min-height:300px;padding:30px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.flash .w{font:600 clamp(2.1rem,9vw,3.2rem)/1.15 var(--en);direction:ltr;letter-spacing:-.03em}
.flash .he{font:700 1.45rem/1.4 var(--body);color:var(--primary)}
.flash .ex{font:400 1.02rem/1.6 var(--en);direction:ltr;color:var(--muted);max-width:52ch}
.boxes{display:flex;gap:4px;direction:ltr}
.boxes i{width:18px;height:8px;border-radius:99px;background:var(--soft)}
.boxes i.on{background:var(--good-fill)}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-actions .btn{min-height:56px;font-size:1.05rem}
.card-actions .btn:only-child{grid-column:1/-1}
.kbd-hint{opacity:.7;font-weight:500}
@media (hover:none){.kbd-hint{display:none}}

/* ---------- tables, meters, pills ---------- */
.scroll{overflow-x:auto;border-radius:var(--r-sm);border:2px solid var(--rule)}
table{border-collapse:collapse;width:100%;background:var(--sheet);font-size:.93rem}
th,td{border-bottom:1px solid var(--rule);padding:11px 12px;text-align:right;vertical-align:top}
tr:last-child td{border-bottom:0}

function streak(){
  let n=0,d=today(); const act=x=>x&&((x.q||0)+(x.w||0))>0;
  if(!act(S.days[d])) d--; // today not started yet doesn't break the streak
  while(act(S.days[d])){n++;d--}
  return n;
}
function rawForTarget(t){for(let r=0;r<=44;r++) if(scaleFor(r,null)>=t) return r; return 44}
// best available estimate of the real score, with its source
function readiness(){
  const past=S.results.filter(r=>r.kind==="past").slice(-3);
  if(past.length) return {score:Math.round(past.reduce((s,r)=>s+r.score,0)/past.length),src:`ממוצע ${past.length} מבחני העבר האחרונים`,sure:"גבוהה"};
  const sims=S.results.filter(r=>r.kind==="sim").slice(-3);
  if(sims.length) return {score:Math.round(sims.reduce((s,r)=>s+r.score,0)/sims.length),src:`ממוצע ${sims.length} הסימולציות האחרונות`,sure:"בינונית"};
  const t=["sc","rs","rc"].map(k=>S.stats[k]||{n:0,c:0}); const n=t.reduce((s,x)=>s+x.n,0);
  if(n>=20){const acc=t.reduce((s,x)=>s+x.c,0)/n; return {score:Math.round(50+100*acc*0.85),src:`לפי ${n} שאלות תרגול`,sure:"נמוכה"}}
  return null;
}
function weakestType(){
  const k=["sc","rs","rc"].map(t=>{const s=S.stats[t]||{n:0,c:0};return{t,acc:s.n?s.c/s.n:0,n:s.n}});
  const fresh=k.filter(x=>x.n<8); if(fresh.length) return fresh[0].t;
  return k.sort((a,b)=>a.acc-b.acc)[0].t;
}

  steps.push({id:"prac",t:`תרגול ממוקד: ${TYPE_HE[weak]}`,d:"הסוג שבו הדיוק שלך הכי נמוך",done:a.q>=12,go:()=>{P.cfg=Object.assign(P.cfg,{type:weak,mode:"learn",n:weak==="rc"?5:8,d:0,timed:wk>=2});P.run=null;P.review=null;startPractice();go("practice")}});
  if(wk>=2) steps.push({id:"exam",t:wk>=4?"מבחן עבר או סימולציה מלאה":"פרק בפורמט מבחן",d:wk>=4?"לפי שבוע התוכנית":"פרק רשמי עם שעון",done:S.results.some(r=>today()===Math.floor((r.t-new Date(r.t).getTimezoneOffset()*6e4)/864e5)),go:()=>go(wk>=4?"past":"sim")});
  const nextLesson=C.lessons.find(l=>!S.lessons[l.id]);
  if(nextLesson&&wk<3) steps.push({id:"lesson",t:`שיעור: ${nextLesson.title}`,d:nextLesson.summary||"",done:false,go:()=>{LN.cur=nextLesson.id;go("learn")}});
  return steps;
}

function ringBig(done,total){

  return `<svg viewBox="0 0 110 110" width="110" height="110" role="img" aria-label="${done} מתוך ${total}"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${p>=.8?"var(--good-fill)":p>=.5?"var(--primary)":"var(--amber)"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 55 55)"/><text x="55" y="63" text-anchor="middle" style="fill:var(--ink);font:800 24px var(--body)">${Math.round(100*p)}%</text></svg>`;
}
function ringSvg(done,total){
  const r=22,c=2*Math.PI*r,p=total?done/total:0;
  return `<svg viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="${done} מתוך ${total} הושלמו" style="flex:none"><circle cx="28" cy="28" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="5"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${p>=1?"#5FD08F":"#FFFFFF"}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 28 28)"/><text x="28" y="33" text-anchor="middle" style="fill:currentColor;font:700 14px var(--body)">${done}/${total}</text></svg>`;

function trendSvg(scores){

  const pts=scores.slice(-20),W=640,H=180,pl=34,pr=10,pt=10,pb=22;
  const x=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)), y=s=>pt+(150-s)*(H-pt-pb)/100;
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join("");
  const grid=[50,88,104,120,134,150].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" ${v===134?'stroke="var(--good)" stroke-dasharray="5 4"':''}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.score)}" r="${i===pts.length-1?5:3.5}" fill="${p.kind==="past"?"var(--accent)":"var(--ink)"}"/>`).join("");
  return `<div class="scroll" style="direction:ltr"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:360px" role="img" aria-label="גרף ציונים">${grid}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg></div><p class="small muted">כחול: מבחני עבר. שחור: סימולציות באתר. הקו הירוק המקווקו: 134 (פטור).</p>`;
}

let W={mode:"cards",queue:[],cur:null,shown:false,quiz:null,q:"",filter:"all",done:0};
function buildQueue(){
  const t=today(); if(S.intro.day!==t){S.intro={day:t,n:0}}
  const due=Object.keys(S.srs).filter(w=>S.srs[w].due<=t&&VBY[w]).sort((a,b)=>S.srs[a].b-S.srs[b].b);
  const left=Math.max(0,S.settings.daily-S.intro.n);
  const fresh=C.vocab.filter(v=>!S.srs[v.w.toLowerCase()]).slice(0,left).map(v=>v.w.toLowerCase());
  W.queue=shuffle(due).concat(fresh); W.cur=W.queue.shift()||null; W.shown=false; W.done=0;
}
function grade(word,knew){

  else{s.b=0;s.due=t;W.queue.splice(Math.min(W.queue.length,4),0,word);}

}

function pickItems(type,d,n){
  const flat=[];
  if(type==="rc"){nearest(C.rc,d,Math.max(1,Math.round(n/5))).forEach(p=>p.qs.forEach((q,i)=>flat.push({it:Object.assign({id:p.id+"_"+i,kind:"mc"},q),p})));return flat}
  if(type==="lc"){nearest(C.lc,0,Math.max(1,Math.round(n/5))).forEach(s=>s.clips.forEach((c,ci)=>c.qs.forEach((q,qi)=>flat.push({it:Object.assign({id:s.id+"_"+ci+"_"+qi,kind:"mc"},q),clip:c,setId:s.id}))));return flat}
  if(type==="ct") return nearest(C.ct,0,n).map(x=>({it:Object.assign({},x,{kind:"mc"}),clip:{context:CT_CONTEXT,script:x.script}}));
  if(type==="wf") return nearest(C.wf,d,n).map(x=>({it:Object.assign({},x,{kind:"wf"})}));
  if(type==="gc") return nearest(C.gc,d,n).map(x=>({it:Object.assign({},x,{kind:"mc"})}));
  const pool=type==="sc"?allSC():allRS();
  return nearest(pool,d,n).map(x=>({it:Object.assign(type==="sc"?alphaSort(x):Object.assign({},x),{kind:"mc"})}));
}

const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

const seenOf=id=>S.seen[id]||0;
const markSeen=id=>{S.seen[id]=(S.seen[id]||0)+1};
function alphaSort(x){ // the real test lists sentence-completion options alphabetically
  const idx=x.o.map((o,i)=>i).sort((i,j)=>String(x.o[i]).toLowerCase().localeCompare(String(x.o[j]).toLowerCase()));
  return Object.assign({},x,{o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a)});
}
function nearest(pool,d,n,used){
  const p=pool.filter(x=>!used||!used.has(x.id));
  return shuffle(p).sort((a,b)=>(d?Math.abs((a.d||2)-d)-Math.abs((b.d||2)-d):0)||seenOf(a.id)-seenOf(b.id)).slice(0,n);
}
const CT_CONTEXT="You will hear the beginning of a short talk.";
// returns {items, passage?, clips?, d}
function pickChapter(type,d,n,used){
  n=n||CH_SPEC[type][0];
  if(type==="sc"){const it=nearest(allSC(),d,n,used).sort((a,b)=>(a.d||2)-(b.d||2));return{items:it.map(x=>Object.assign(alphaSort(x),{kind:"mc"})),d}}
  if(type==="rs"){const it=nearest(allRS(),d,n,used).sort((a,b)=>(a.d||2)-(b.d||2));return{items:it.map(x=>Object.assign({},x,{kind:"mc"})),d}}
  if(type==="gc"){return{items:nearest(C.gc,d,n,used).map(x=>Object.assign({},x,{kind:"mc"})),d}}
  if(type==="wf"){return{items:nearest(C.wf,d,n,used).map(x=>Object.assign({},x,{kind:"wf"})),d}}
  if(type==="ct"){return{items:nearest(C.ct,0,n,used).map(x=>Object.assign({},x,{kind:"mc",context:CT_CONTEXT})),d:2}}

let TTS={on:false,timer:null};
function ttsVoices(){try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return[]}}
function ttsStop(){try{speechSynthesis.cancel()}catch(e){} clearInterval(TTS.timer); TTS.on=false;}
function speak(script,onProg,onEnd){
  if(!("speechSynthesis" in window)){onEnd&&onEnd(false);return}
  ttsStop();
  const lines=String(script).split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const voices=ttsVoices(); const pref=voices.filter(v=>/en-US/i.test(v.lang)); const pool=pref.length?pref:voices;
  const spk={}; let vi=0;
  const parts=lines.map(l=>{const m=l.match(/^([A-Z][A-Za-z .]{0,20}):\s*(.*)$/);if(m){if(!(m[1] in spk))spk[m[1]]=vi++;return{t:m[2],s:spk[m[1]]}}return{t:l,s:0}});
  const total=Math.max(1,countWords(script)/2.4); const t0=Date.now(); TTS.on=true;
  TTS.timer=setInterval(()=>{onProg&&onProg(Math.min(1,(Date.now()-t0)/1000/total))},250);
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.t);u.lang="en-US";u.rate=.95;
    if(pool.length)u.voice=pool[p.s%pool.length]; if(!pool.length||pool.length<2)u.pitch=p.s%2?0.8:1.1;
    if(i===parts.length-1)u.onend=()=>{clearInterval(TTS.timer);TTS.on=false;onProg&&onProg(1);onEnd&&onEnd(true)};
    speechSynthesis.speak(u)});
}

let SM=null; let SIMCFG={exp:true};
function simPlan(){
  const base=["sc","sc","rc","rs","rs","sc"]; if(!SIMCFG.exp) return base;
  const have=["gc","wf","ct","lc"].filter(t=>(C[t]||[]).length);
  if(C.wr.length&&(Math.random()<.25||have.length<2)) return base.concat(["wr"]);
  if(have.length<2) return base;
  return base.concat(shuffle(have).slice(0,2));
}
function simLevel(chs){
  const scored=chs.filter((c,i)=>i<6); if(!scored.length)return 2;
  const last=scored[scored.length-1]; const p=last.items.filter((x,i)=>isCorrect(x,last.pick[i])).length/last.items.length;
  return Math.max(1,Math.min(3,(last.d||2)+(p>=0.75?1:p<0.5?-1:0)));
}
function simScoreOf(chs){
  const all=[]; chs.slice(0,6).forEach(c=>c.items.forEach((x,i)=>all.push({ok:isCorrect(x,c.pick[i]),d:x.d||c.d||2})));
  const p=all.filter(x=>x.ok).length/all.length; const avgD=all.reduce((s,x)=>s+x.d,0)/all.length;
  let base=50+100*(p*0.78+(avgD-1)*0.11);
  const exp=chs.slice(6).flatMap(c=>c.items.map((x,i)=>isCorrect(x,c.pick[i]))).filter(v=>v!==null);
  const bonus=exp.length?2*exp.filter(Boolean).length/exp.length:0;
  return {p,avgD,bonus:Math.round(bonus*10)/10,score:Math.round(Math.max(50,Math.min(150,base+bonus))),correct:all.filter(x=>x.ok).length,total:all.length};
}

function scoreGauge(score,target){

  return `<svg viewBox="0 0 120 70" width="220" height="128" role="img" aria-label="ציון ${score} מתוך 150"><path d="M8 62a52 52 0 0 1 104 0" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="10" stroke-linecap="round"/><path d="M8 62a52 52 0 0 1 104 0" fill="none" stroke="${score>=target?"#5FD08F":"#fff"}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/><circle cx="${tx}" cy="${ty}" r="3.5" fill="#FBBF24"/><text x="60" y="58" text-anchor="middle" style="fill:#fff;font:800 26px var(--body)">${score}</text></svg>`;
}

  ${G.wrong.length?`<h3>מה טעיתי? (הסיווג נשמר ביומן)</h3>${G.wrong.map(w=>{const key=`${e.id}_${w.s}_${w.q}`;const er=S.errors.find(x=>x.ref===key);return `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px"><span>פרק ${w.s+1}, שאלה ${w.q+1} <span class="muted small">(${TYPE_HE[w.t]}; סימנת ${w.a||"—"}, הנכונה ${w.k})</span></span><div class="cat">${CATS.map(([k,t])=>`<button class="chip" data-pcat="${k}" data-key="${key}" aria-pressed="${er&&er.cat===k}">${t}</button>`).join("")}</div></div>`}).join("")}`:"<p>אין טעויות!</p>"}
  <p class="small muted">על כל טעות כדאי לחזור ב-PDF. מילים שלא הכרת מוסיפים לכרטיסיות דרך רשימת המילים.</p></div>`;
}

let LG={type:"all",cat:"all"};
// mistakes that can be re-asked on their own (no passage or recording needed)
// rebuild a practice entry for a logged mistake from the current content (passage / recording included)
function resolveErr(e){
  const base={type:e.type,retry:true};
  const find=(arr,id)=>(arr||[]).find(x=>x.id===id);
  if(e.type==="sc"){const x=find(allSC(),e.ref);if(x)return Object.assign(base,{it:Object.assign(alphaSort(x),{kind:"mc"})})}
  if(e.type==="rs"){const x=find(allRS(),e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"mc"})})}
  if(e.type==="gc"){const x=find(C.gc,e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"mc"})})}
  if(e.type==="wf"){const x=find(C.wf,e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"wf"})})}
  if(e.type==="ct"){const x=find(C.ct,e.ref);if(x)return Object.assign(base,{it:Object.assign({},x,{kind:"mc"}),clip:{context:CT_CONTEXT,script:x.script}})}
  if(e.type==="rc"){const m=String(e.ref).match(/^(.*)_(\d+)$/);const p=m&&find(C.rc,m[1]);const q=p&&p.qs[+m[2]];if(q)return Object.assign(base,{p,it:Object.assign({id:e.ref,kind:"mc"},q)})}
  if(e.type==="lc"){const m=String(e.ref).match(/^(.*)_(\d+)_(\d+)$/);const st=m&&find(C.lc,m[1]);const c=st&&st.clips[+m[2]];const q=c&&c.qs[+m[3]];if(q)return Object.assign(base,{clip:c,setId:st.id,it:Object.assign({id:e.ref,kind:"mc"},q)})}
  if(e.o||e.acc) return Object.assign(base,{it:{id:e.ref,kind:e.acc?"wf":"mc",q:e.q,o:e.o,a:e.a,ans:e.acc,ex:e.ex}});
  return null;
}
function retryPool(){const seen=new Set();return S.errors.filter(e=>e.src!=="past"&&!seen.has(e.ref)&&seen.add(e.ref)).map(resolveErr).filter(Boolean)}
function vLog(app){
  const E=S.errors;
  const byCat=Object.fromEntries(CATS.map(([k])=>[k,0])); let none=0; E.forEach(e=>e.cat?byCat[e.cat]++:none++);
  const max=Math.max(1,...Object.values(byCat));
  const list=E.filter(e=>(LG.type==="all"||e.type===LG.type)&&(LG.cat==="all"||(LG.cat==="none"?!e.cat:e.cat===LG.cat))).slice().reverse();
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const tip={word:"רוב הטעויות שלך הן מילים לא מוכרות. כדאי להעלות את מספר המילים החדשות ביום ולהוסיף לכרטיסיות כל מילה מהשאלות.",trap:"רוב הטעויות שלך הן מלכודות. בניסוח מחדש כדאי לעבור על כל תשובה ולבדוק שלילה, כמת, זמן וכיוון של סיבה ותוצאה.",careless:"רוב הטעויות שלך הן קריאה רשלנית. כדאי לקרוא את כל ארבע התשובות לפני שבוחרים, גם כשהראשונה נראית נכונה.",time:"רוב הטעויות שלך קשורות לזמן. כדאי לתרגל בקצב אמירנט ולא להתעכב על שאלה אחת יותר מ-90 שניות."};
  const RI={word:["words","c-words"],trap:["log","c-log"],careless:["doc","c-rc"],time:["sim","c-sim"]};
  const rp=retryPool().length;
  app.innerHTML=`<section class="page-head"><h1>יומן טעויות</h1><p>${E.length?`${E.length} טעויות. סווג כל טעות לפי הסיבה, ותרגל אותן שוב עד שהן נעלמות.`:"כאן נאספות הטעויות שלך מכל התרגולים."}</p></section>
  ${E.length?`${rp?`<section class="hero" style="padding:18px"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;position:relative;z-index:1"><div class="stack" style="gap:2px"><h2>תרגול טעויות</h2><span class="small muted">תשובה נכונה מוחקת את הטעות מהיומן</span></div><span class="badge" style="background:rgba(255,255,255,.15);border:0;color:#fff">${rp}</span></div><button class="btn wide" id="retry" style="position:relative;z-index:1">לתרגל שוב ${Math.min(20,rp)} שאלות</button></section>`:""}
  <section class="field"><span class="lbl">למה טעיתי? (לחיצה מסננת)</span><div class="reasons">${CATS.map(([k,t])=>`<button class="reason" data-lc="${k}" aria-pressed="${LG.cat===k}"><span class="ic ${RI[k][1]}">${ico(RI[k][0])}</span><span><b class="num">${byCat[k]}</b><span>${t}</span></span></button>`).join("")}</div>
  ${none?`<span class="small muted">${none} טעויות עוד לא סווגו. <button class="chip" data-lc="none" aria-pressed="${LG.cat==="none"}" style="min-height:32px;padding:3px 10px">להציג אותן</button>${LG.cat!=="all"?` <button class="chip" data-lc="all" style="min-height:32px;padding:3px 10px">הכול</button>`:""}</span>`:""}</section>
  ${top&&top[1]>=3?`<p class="explain">${tip[top[0]]}</p>`:""}
  <div class="seg tabs">${[["all","כל הסוגים"],["sc","השלמה"],["rs","ניסוח מחדש"],["rc","קריאה"],["gc","דקדוק"],["wf","יצירת מילה"]].map(([k,t])=>`<button class="chip" data-lt="${k}" aria-pressed="${LG.type===k}">${t}</button>`).join("")}</div>
  <div class="stack">${list.slice(0,80).map(e=>{const idx=E.indexOf(e);return `<details class="card"><summary class="row" style="justify-content:space-between"><span>${TYPE_HE[e.type]||""} · <span class="muted small">${new Date(e.t).toLocaleDateString("he-IL")} · ${{practice:"תרגול",sim:"סימולציה",past:"מבחן עבר"}[e.src]||""}</span></span>${e.cat?`<span class="pill">${CAT_HE[e.cat]}</span>`:`<span class="pill warn-t">לא סווג</span>`}</summary>
    ${e.o?`<div class="stem">${stemHtml(e.q)}</div><div class="opts">${e.o.map((o,k)=>`<div class="opt ${k===e.a?"ok":k===e.pick?"no":""}"><span class="bub">${k+1}</span><span>${esc(o)}</span></div>`).join("")}</div>${e.ex?`<div class="explain">${esc(e.ex)}</div>`:""}`:(e.acc?`<div class="stem">${esc(e.q)}</div><p>כתבת: <b class="en">${esc(e.typed||"—")}</b> · נכון: <b class="en">${esc(e.acc.join(" / "))}</b></p>${e.ex?`<div class="explain">${esc(e.ex)}</div>`:""}`:`<p>${esc(e.q)} · סימנת ${e.pick>=0?e.pick+1:"—"}, התשובה הנכונה ${e.a+1}</p>`)}
    <div class="cat">${CATS.map(([k,t])=>`<button class="chip" data-ec="${k}" data-ei="${idx}" aria-pressed="${e.cat===k}">${t}</button>`).join("")}<button class="btn sm ghost" data-del="${idx}">הבנתי, למחוק</button></div></details>`}).join("")||`<div class="empty">אין טעויות שמתאימות לסינון.</div>`}</div>`
  :`<div class="empty">היומן ריק. כל טעות בתרגול, בסימולציה או במבחן עבר תיכנס לכאן אוטומטית, ותוכל לסווג אותה לפי הסיבה.</div>`}`;
  app.querySelectorAll("[data-lt]").forEach(b=>b.onclick=()=>{LG.type=b.dataset.lt;render()});
  const rt=$("#retry"); if(rt) rt.onclick=()=>{const items=shuffle(retryPool()).slice(0,20);S.daily[today()]=Object.assign(S.daily[today()]||{},{retry:true});save();P.review=null;P.run={type:items[0].type,items,i:0,pick:{},score:0,cat:{},t0:Date.now(),left:null};view="practice";render();window.scrollTo(0,0)};
  app.querySelectorAll("[data-lc]").forEach(b=>b.onclick=()=>{LG.cat=LG.cat===b.dataset.lc?"all":b.dataset.lc;render()});
  app.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>{const e=S.errors[+b.dataset.ei];if(e){e.cat=b.dataset.ec;save();render()}});
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.errors.splice(+b.dataset.del,1);save();render()});
}
